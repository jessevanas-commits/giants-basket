<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#791E22,#000 75%)}
canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none}
#reveal{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
 background:radial-gradient(circle at 50% 35%,#DA2129 0%,#791E22 55%,#000 100%);padding:20px;box-sizing:border-box;overflow:hidden}
#reveal>:not(.conf){position:relative;z-index:1}
#reveal.on{display:flex;animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#reveal img{width:130px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));animation:spin 1.2s ease-out}
@keyframes spin{from{transform:rotate(-360deg) scale(.2)}to{transform:none}}
#reveal h1{font-size:clamp(26px,7vw,48px);margin:14px 0 4px;letter-spacing:1px;text-transform:uppercase}
#reveal h2{font-size:clamp(15px,4vw,20px);font-weight:normal;margin:0 0 18px;opacity:.9}
.code{background:#fff;color:#DA2129;font:bold clamp(34px,10vw,64px) 'Courier New',monospace;letter-spacing:6px;padding:12px 26px;border-radius:14px;border:4px dashed #000;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#reveal p{max-width:460px;font-size:clamp(14px,3.8vw,18px);line-height:1.45;margin:18px 0 0}
#reveal small{display:block;margin-top:14px;opacity:.7;font-size:12px}
#again{margin-top:18px;background:#000;color:#fff;border:2px solid #fff;border-radius:30px;padding:10px 22px;font-size:15px;cursor:pointer}
.conf{position:absolute;z-index:0;pointer-events:none;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

function reset(){ball={x:START.x,y:START.y,vx:0,vy:0,fly:false,above:false,scored:false,t:0}}reset();
function pos(e){var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]||e.changedTouches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height,t:performance.now()}}
var drag=null;
function down(e){if(ball.fly||done)return;var p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<90){drag=[p];e.preventDefault()}}
function move(e){if(!drag)return;var p=pos(e);drag.push(p);if(drag.length>6)drag.shift();ball.x=p.x;ball.y=Math.max(p.y,420);e.preventDefault()}
function up(e){if(!drag)return;var a=drag[0],b=drag[drag.length-1],dt=Math.max((b.t-a.t)/1000,0.016);
 var vx=(b.x-a.x)/dt*0.9,vy=(b.y-a.y)/dt*1.35;drag=null;
 if(vy>-300){reset();return}
 var sp=Math.hypot(vx,vy),mx=1650;if(sp>mx){vx*=mx/sp;vy*=mx/sp}
 throwBall(vx,vy);e.preventDefault()}
cv.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up,{passive:false});
function throwBall(vx,vy){ball.vx=vx;ball.vy=vy;ball.fly=true;ball.t=0}
// test hook: perfect throw from current position
window.__x_=function(){reset();var ay=140,vy=-Math.sqrt(2*G*(ball.y-ay)),T=-vy/G+Math.sqrt(2*(HOOP.y+5-ay)/G);throwBall((HOOP.x-ball.x)/T,vy)};
window.__score=function(){return score};
function bounce(p){var dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<R+4&&d>0){var nx=dx/d,ny=dy/d,v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=1.6*v*nx;ball.vy-=1.6*v*ny}ball.x=p.x+nx*(R+4);ball.y=p.y+ny*(R+4)}}
function step(dt){if(!ball.fly)return;ball.t+=dt;ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.y<HOOP.y-R)ball.above=true;
 bounce(rimL);bounce(rimR);
 if(!ball.scored&&ball.above&&ball.vy>0&&ball.y>HOOP.y&&ball.y<HOOP.y+30&&ball.x>rimL.x+4&&ball.x<rimR.x-4){ball.scored=true;score++;
  msg=score<3?['Raak! 🔥','Nog één!'][score-1]:'DRIE OP DRIE!';msgT=1.4;burst(HOOP.x,HOOP.y+20);if(score>=3)setTimeout(win,900)}
 if(ball.x<-60||ball.x>W+60||ball.y>H+60||ball.t>4){if(!ball.scored&&!done){msg='Mis! Probeer opnieuw';msgT=1.2}reset()}
 trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift()}
var parts=[];function burst(x,y){for(var i=0;i<40;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*500,vy:(Math.random()-.8)*500,l:1,c:['#DA2129','#fff','#791E22','#000'][i%4]})}
function drawBall(x,y){cx.save();cx.translate(x,y);var g=cx.createRadialGradient(-7,-7,3,0,0,R);g.addColorStop(0,'#ff8a3d');g.addColorStop(1,'#c4500f');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,R,0,7);cx.fill();
 cx.strokeStyle='#2a1200';cx.lineWidth=2;cx.beginPath();cx.moveTo(-R,0);cx.lineTo(R,0);cx.moveTo(0,-R);cx.lineTo(0,R);cx.stroke();cx.beginPath();cx.arc(-R*1.15,0,R*.8,-.9,.9);cx.stroke();cx.beginPath();cx.arc(R*1.15,0,R*.8,Math.PI-.9,Math.PI+.9);cx.stroke();cx.restore()}
function draw(){cx.clearRect(0,0,W,H);
 var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0204');g.addColorStop(.6,'#791E22');g.addColorStop(1,'#2b0a0b');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.fillStyle='#000';cx.fillRect(0,520,W,180);cx.strokeStyle='#DA2129';cx.lineWidth=4;cx.beginPath();cx.arc(200,700,130,Math.PI,0);cx.stroke();
 cx.fillStyle='#fff';cx.font='bold 22px Arial';cx.textAlign='center';cx.fillText('WINDROSE GIANTS ANTWERP',200,40);
 // score dots
 for(var i=0;i<3;i++){cx.beginPath();cx.arc(160+i*40,72,13,0,7);cx.fillStyle=i<score?'#DA2129':'#333';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke()}
 cx.font='bold 15px Arial';cx.fillStyle='#fff';cx.fillText('Score: '+score+' / 3',200,104);
 // board
 cx.fillStyle='#fff';cx.fillRect(BOARD.x1,BOARD.y1,BOARD.x2-BOARD.x1,BOARD.y2-BOARD.y1);cx.strokeStyle='#DA2129';cx.lineWidth=4;cx.strokeRect(BOARD.x1+28,BOARD.y1+28,44,44);
 if(logo.complete)cx.drawImage(logo,BOARD.x1+38,BOARD.y1+6,24,27);
 cx.fillStyle='#888';cx.fillRect(196,200,8,30);
 var behind=ball.fly&&ball.vy>0&&ball.above;
 function net(){cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=1.5;for(var i=0;i<=6;i++){var x=rimL.x+i*(2*HOOP.r)/6;cx.beginPath();cx.moveTo(x,HOOP.y);cx.lineTo(HOOP.x+(x-HOOP.x)*.55,HOOP.y+55);cx.stroke()}
  for(var j=1;j<4;j++){var y=HOOP.y+j*14,w=HOOP.r*(1-j*.12);cx.beginPath();cx.moveTo(HOOP.x-w,y);cx.lineTo(HOOP.x+w,y);cx.stroke()}}
 if(behind){trailDraw();drawBall(ball.x,ball.y)}
 net();cx.strokeStyle='#DA2129';cx.lineWidth=6;cx.beginPath();cx.moveTo(rimL.x,rimL.y);cx.lineTo(rimR.x,rimR.y);cx.stroke();
 if(!behind){trailDraw();drawBall(ball.x,ball.y)}
 parts.forEach(function(p){cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,6,6)});cx.globalAlpha=1;
 if(msgT>0||(!ball.fly&&score==0)){cx.fillStyle='#fff';cx.font='bold 20px Arial';cx.fillText(msg,200,470)}
 if(!ball.fly&&!drag&&!done){cx.font='14px Arial';cx.fillStyle='rgba(255,255,255,.7)';cx.fillText('↑ swipe omhoog ↑',200,660)}}
function trailDraw(){trail.forEach(function(t,i){cx.globalAlpha=i/30;cx.fillStyle='#DA2129';cx.beginPath();cx.arc(t.x,t.y,R*.8,0,7);cx.fill()});cx.globalAlpha=1;if(!ball.fly)trail=[]}
function win(){done=true;var rv=document.getElementById('reveal');rv.classList.add('on');
 for(var i=0;i<70;i++){var d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=['#DA2129','#fff','#791E22','#000'][i%4];d.style.animationDuration=2+Math.random()*3+'s';d.style.animationDelay=Math.random()*1.5+'s';rv.appendChild(d)}}
document.getElementById('again').onclick=function(){score=0;done=false;msg='Sleep of swipe de bal naar de ring!';document.getElementById('reveal').classList.remove('on');reset()};
var last=performance.now();function loop(n){var dt=Math.min((n-last)/1000,0.033);last=n;for(var k=0;k<4;k++)step(dt/4);
 parts.forEach(function(p){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(function(p){return p.l>0});msgT-=dt;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(location.hash=='#demo'){var n=0,iv=setInterval(function(){if(!ball.fly){__autoThrow();if(++n>=3)clearInterval(iv)}},300)}
})();
</script></body></html>
